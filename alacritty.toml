[colors]
[colors.primary]
background = "#232227"
foreground = "#b7a98d"

[colors.normal]
black   = "#232227"
red     = "#b17f6d"
green   = "#898b77"
yellow  = "#b4a36f"
blue    = "#8f9696"
magenta = "#a58a86"
cyan    = "#6296a0"
white   = "#b7a98d"

[colors.bright]
black   = "#736a60"
red     = "#c7927a"
green   = "#9c9f87"
yellow  = "#d2bd7d"
blue    = "#adb5b4"
magenta = "#b79a95"
cyan    = "#7eb7c0"
white   = "#c9b99b"

[colors.cursor]
text   = "#232227"
cursor = "#c9b99b"

[colors.selection]
text       = "#232227"
background = "#6296a0"

