# Keep it in sync with hyprland.lua where possible.

$activeBorderColor = rgb(d2bd7d)
$inactiveBorderColor = rgba(736a60aa)
$groupBarActive = rgba(232227e6)
$groupBarInactive = rgba(736a60b8)
$textColor = rgb(b7a98d)
$inactiveTextColor = rgba(968975cc)

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    resize_on_border = false
    layout = dwindle
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor

    groupbar {
        font_size = 12
        font_family = monospace
        font_weight_active = bold
        font_weight_inactive = normal
        height = 22
        gaps_in = 5
        gaps_out = 0
        indicator_height = 0
        indicator_gap = 5
        text_color = $textColor
        text_color_inactive = $inactiveTextColor
        gradients = false
        col.active = $groupBarActive
        col.inactive = $groupBarInactive
    }
}

decoration {
    rounding = 0
    dim_inactive = true
    dim_strength = 0.10
    dim_special = 0.16

    shadow {
        enabled = false
    }

    blur {
        enabled = true
    }
}

animations {
    enabled = true

    bezier = blackPharaohFocus, 0.18, 0.82, 0.22, 1.0
    bezier = blackPharaohFade, 0.35, 0.0, 0.25, 1.0

    animation = windows, 1, 4.0, blackPharaohFocus
    animation = windowsIn, 1, 4.2, blackPharaohFocus, popin 96%
    animation = windowsOut, 1, 3.0, blackPharaohFade, popin 98%
    animation = border, 1, 5.0, blackPharaohFocus
    animation = fade, 1, 3.0, blackPharaohFade
    animation = layers, 1, 3.6, blackPharaohFocus
    animation = layersIn, 1, 3.8, blackPharaohFocus, fade
    animation = layersOut, 1, 2.8, blackPharaohFade, fade
    animation = workspaces, 1, 3.8, blackPharaohFocus, slide
}

